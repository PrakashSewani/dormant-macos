name: Dormant
options:
  bundleIdPrefix: com.dormant
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
targets:
  DormantCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/DormantCore
    settings:
      base:
        OTHER_LDFLAGS: -lsqlite3
  DormantCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DormantCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dormant.DormantCoreTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DormantCore
  DormantApp:
    type: application
    platform: macOS
    sources:
      - Sources/DormantApp
    settings:
      base:
        PRODUCT_NAME: Dormant
        PRODUCT_BUNDLE_IDENTIFIER: com.dormant.Dormant
        INFOPLIST_FILE: Sources/DormantApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DormantCore
      - target: DormantFinder
        embed: true
  DormantFinder:
    type: app-extension
    platform: macOS
    sources:
      - Sources/DormantFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dormant.Dormant.Finder
        INFOPLIST_FILE: Sources/DormantFinder/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Sources/DormantFinder/DormantFinder.entitlements
    dependencies:
      - target: DormantCore
schemes:
  Dormant:
    build:
      targets:
        DormantApp: all
        DormantFinder: all
        DormantCoreTests:
          - test
    test:
      targets:
        - DormantCoreTests
